<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Espacio | Invictos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden; 
            scroll-behavior: smooth;
            background: radial-gradient(circle at top right, #fff5f5, #f8fafc);
        }
        .font-romance { font-family: 'Dancing Script', cursive; }
        .font-serif-bold { font-family: 'Playfair Display', serif; }
        
        .sidebar-active { 
            background: #0f172a; 
            color: white; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Corazones flotantes más sutiles */
        .heart-particle {
            position: fixed;
            top: -20px;
            color: #fda4af;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            animation: fall linear forwards;
            opacity: 0.4;
        }
        @keyframes fall { 
            to { transform: translateY(105vh) rotate(360deg); }
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .recording-pulse {
            animation: pulse-red 2s infinite;
            background-color: #f43f5e !important;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }

        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            z-index: 200;
            cursor: zoom-out;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            opacity: 0;
            transition: all 0.4s ease;
        }

        /* Estilización de Audio */
        audio::-webkit-media-controls-panel { background-color: #f1f5f9; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="text-slate-900 min-h-screen">

    <div id="hearts-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Vista expandida" class="scale-95 transition-transform duration-300">
    </div>

    <div id="login-screen" class="fixed inset-0 z-[100] bg-white flex items-center justify-center p-6">
        <div class="max-w-md w-full text-center space-y-12 animate-fade">
            <div class="relative inline-block">
                <div class="w-24 h-24 bg-rose-50 text-rose-500 rounded-[2.5rem] flex items-center justify-center mx-auto shadow-inner">
                    <i data-lucide="heart" size="32" fill="currentColor"></i>
                </div>
                <div class="absolute -top-2 -right-2 w-6 h-6 bg-rose-500 rounded-full border-4 border-white"></div>
            </div>
            
            <div class="space-y-4">
                <h1 class="text-5xl font-black tracking-tight text-slate-900">
                    Hola, <span class="font-romance text-rose-500 normal-case">amor</span>
                </h1>
                <p class="text-slate-400 font-bold text-[10px] uppercase tracking-[0.5em]">Ingresa a nuestro baúl</p>
            </div>

            <form id="login-form" class="space-y-6">
                <input type="password" id="password-input" placeholder="Clave Especial" 
                    class="w-full bg-slate-50 p-6 rounded-[2rem] border-2 border-transparent focus:border-rose-100 focus:bg-white outline-none transition-all text-center font-bold placeholder:text-slate-300 shadow-sm">
                
                <button type="submit" class="w-full bg-slate-900 text-white font-extrabold py-6 rounded-[2rem] hover:bg-rose-600 hover:shadow-rose-200 transition-all uppercase tracking-widest text-xs shadow-xl">
                    Abrir Espacio
                </button>
                <p id="error-message" class="hidden text-rose-500 text-[11px] font-black uppercase tracking-widest animate-pulse">Esa no es la clave, vida mía</p>
            </form>
        </div>
    </div>

    <div id="main-app" class="hidden flex min-h-screen relative z-10">
        <aside class="hidden lg:flex flex-col w-80 fixed left-0 top-0 bottom-0 bg-white/50 backdrop-blur-xl border-r border-slate-100 p-10 z-40">
            <div class="mb-16 flex items-center gap-3">
                <div class="w-10 h-10 bg-slate-900 rounded-2xl flex items-center justify-center text-white">
                    <i data-lucide="shield-check" size="20"></i>
                </div>
                <span class="text-2xl font-black italic tracking-tighter text-slate-900">INVICTOS</span>
            </div>
            
            <nav class="flex-1 space-y-3">
                <button onclick="changeTab('home')" class="nav-link w-full flex items-center gap-4 p-5 rounded-3xl font-bold transition-all text-sm group" data-tab="home">
                    <i data-lucide="layout-grid" size="18"></i> <span>Inicio</span>
                </button>
                <button onclick="changeTab('gallery')" class="nav-link w-full flex items-center gap-4 p-5 rounded-3xl font-bold transition-all text-sm group" data-tab="gallery">
                    <i data-lucide="camera" size="18"></i> <span>Galería</span>
                </button>
                <button onclick="changeTab('music')" class="nav-link w-full flex items-center gap-4 p-5 rounded-3xl font-bold transition-all text-sm group" data-tab="music">
                    <i data-lucide="music" size="18"></i> <span>Música</span>
                </button>
                <button onclick="changeTab('diary')" class="nav-link w-full flex items-center gap-4 p-5 rounded-3xl font-bold transition-all text-sm group" data-tab="diary">
                    <i data-lucide="pen-tool" size="18"></i> <span>Diario</span>
                </button>
            </nav>
        </aside>

        <nav class="lg:hidden fixed bottom-8 left-6 right-6 bg-white/80 backdrop-blur-2xl border border-white shadow-[0_20px_50px_rgba(0,0,0,0.1)] rounded-[3rem] flex justify-around p-4 z-50">
            <button onclick="changeTab('home')" class="nav-link-m p-4 rounded-2xl transition-all" data-tab="home"><i data-lucide="home" size="22"></i></button>
            <button onclick="changeTab('gallery')" class="nav-link-m p-4 rounded-2xl transition-all" data-tab="gallery"><i data-lucide="image" size="22"></i></button>
            <button onclick="changeTab('music')" class="nav-link-m p-4 rounded-2xl transition-all" data-tab="music"><i data-lucide="music-4" size="22"></i></button>
            <button onclick="changeTab('diary')" class="nav-link-m p-4 rounded-2xl transition-all" data-tab="diary"><i data-lucide="mic" size="22"></i></button>
        </nav>

        <main class="flex-1 lg:pl-80 bg-transparent min-h-screen relative">
            <section id="tab-home" class="tab-content active p-6 lg:p-12 h-screen overflow-y-auto">
                <div class="max-w-4xl mx-auto flex flex-col items-center justify-center min-h-full text-center space-y-16 animate-fade">
                    
                    <div class="flex gap-4 md:gap-12 justify-center items-center glass-card p-8 rounded-[3rem] shadow-xl w-full max-w-2xl border border-white/50">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-black text-rose-400 uppercase tracking-[0.3em] mb-2">Lima, Perú</span>
                            <span id="clock-lima" class="text-4xl font-black text-slate-900 tracking-tighter">--:--</span>
                        </div>
                        <div class="h-12 w-px bg-slate-200 mx-4"></div>
                        <div class="flex flex-col">
                            <span class="text-[10px] font-black text-rose-400 uppercase tracking-[0.3em] mb-2">Guanare, Ven</span>
                            <span id="clock-guanare" class="text-4xl font-black text-slate-900 tracking-tighter">--:--</span>
                        </div>
                    </div>

                    <div class="space-y-8">
                        <h2 class="text-7xl md:text-9xl font-serif-bold italic tracking-tighter text-slate-900 leading-none">
                            Evelyn <span class="text-rose-500 font-romance text-5xl md:text-7xl">&</span> Juan
                        </h2>
                        
                        <div class="inline-flex items-center gap-3 bg-white px-8 py-3 rounded-full text-[11px] font-black uppercase tracking-[0.5em] text-slate-500 shadow-sm border border-slate-100">
                            <span class="relative flex h-2 w-2">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span>
                            </span>
                            Juntos hace
                        </div>

                        <div id="countdown" class="flex gap-6 md:gap-12 justify-center items-center">
                            <div class="flex flex-col">
                                <span id="days" class="text-6xl md:text-8xl font-black text-slate-900 tracking-tighter">00</span>
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-2">Días</span>
                            </div>
                            <div class="flex flex-col">
                                <span id="hours" class="text-6xl md:text-8xl font-black text-slate-900 tracking-tighter">00</span>
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-2">Horas</span>
                            </div>
                            <div class="flex flex-col">
                                <span id="minutes" class="text-6xl md:text-8xl font-black text-rose-500 tracking-tighter">00</span>
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-2">Mins</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="tab-dynamic" class="tab-content p-6 lg:p-20 h-screen overflow-y-auto">
                <div class="max-w-6xl mx-auto">
                    <header class="flex flex-col md:flex-row md:items-end justify-between gap-10 mb-20 animate-fade">
                        <div class="space-y-4">
                            <h2 id="page-title" class="text-7xl font-black tracking-tighter uppercase italic text-slate-900 leading-none">Título</h2>
                            <p id="page-subtitle" class="text-rose-400 font-bold text-[11px] uppercase tracking-[0.5em]">Subtítulo</p>
                        </div>
                        <button onclick="openModal()" class="flex items-center gap-4 bg-slate-900 text-white px-12 py-6 rounded-full font-black text-[11px] uppercase tracking-widest hover:bg-rose-600 hover:scale-105 transition-all shadow-2xl">
                            <i data-lucide="plus" size="20"></i> <span id="btn-text">Agregar</span>
                        </button>
                    </header>
                    <div id="items-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 pb-40"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="item-modal" class="hidden fixed inset-0 z-[100] bg-slate-900/40 backdrop-blur-md flex items-center justify-center p-6">
        <div class="bg-white rounded-[4rem] w-full max-w-xl p-12 shadow-2xl space-y-10 animate-fade overflow-y-auto max-h-[90vh] relative border border-white">
            
            <div id="modal-loader" class="loading-overlay rounded-[4rem]">
                <div class="w-14 h-14 border-4 border-rose-100 border-t-rose-500 rounded-full animate-spin mb-6"></div>
                <p class="text-[11px] font-black uppercase tracking-widest text-slate-900">Guardando el momento...</p>
            </div>

            <div class="flex justify-between items-center">
                <h3 id="modal-title" class="text-3xl font-black tracking-tighter uppercase italic">Nuevo Recuerdo</h3>
                <button onclick="closeModal()" class="w-12 h-12 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 hover:bg-rose-50 hover:text-rose-500 transition-all"><i data-lucide="x" size="24"></i></button>
            </div>
            
            <form id="save-form" class="space-y-6">
                <input type="hidden" id="edit-id">
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-4">¿Qué título le pondrás?</label>
                    <input id="in-title" required placeholder="Nuestra tarde mágica..." class="w-full bg-slate-50 p-6 rounded-[2rem] border-2 border-transparent focus:border-rose-100 focus:bg-white outline-none font-bold transition-all">
                </div>
                
                <div id="music-fields" class="hidden space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-4">Enlace de la canción</label>
                    <input id="in-url" placeholder="YouTube o Spotify Link" class="w-full bg-slate-50 p-6 rounded-[2rem] border-2 border-transparent focus:border-rose-100 focus:bg-white outline-none font-bold transition-all">
                </div>

                <div id="diary-fields" class="hidden">
                    <div class="flex items-center gap-6 p-6 bg-rose-50/50 rounded-[2.5rem] border border-rose-100 mb-6">
                        <button type="button" id="record-btn" class="w-20 h-20 rounded-full bg-rose-500 text-white flex items-center justify-center shadow-lg hover:scale-110 transition-transform">
                            <i data-lucide="mic" size="28" id="mic-icon"></i>
                        </button>
                        <div class="flex-1">
                            <span id="record-status" class="text-[11px] font-black uppercase tracking-widest text-rose-500">¿Quieres grabar tu voz?</span>
                            <div id="audio-preview-container" class="hidden mt-3">
                                <audio id="audio-preview" controls class="h-10 w-full"></audio>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="photo-upload">
                    <label class="flex flex-col items-center justify-center gap-4 w-full bg-slate-50 p-12 rounded-[3rem] border-2 border-dashed border-slate-200 cursor-pointer hover:border-rose-400 hover:bg-rose-50/30 transition-all group">
                        <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform">
                            <i data-lucide="camera" class="text-slate-400 group-hover:text-rose-500" size="28"></i>
                        </div>
                        <span id="file-status" class="text-[11px] font-black text-slate-400 uppercase tracking-widest mt-2">Seleccionar Foto</span>
                        <input id="in-file" type="file" accept="image/*" class="hidden">
                    </label>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-4">Tu mensaje</label>
                    <textarea id="in-desc" placeholder="Escribe aquí lo que sientes..." class="w-full bg-slate-50 p-6 rounded-[2rem] border-2 border-transparent focus:border-rose-100 focus:bg-white outline-none font-bold h-40 resize-none transition-all"></textarea>
                </div>
                
                <button type="submit" id="submit-btn" class="w-full bg-slate-900 text-white py-7 rounded-[2.5rem] font-black text-[12px] uppercase tracking-[0.3em] shadow-2xl hover:bg-rose-600 transition-all transform active:scale-95">Guardar en el Corazón</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{"apiKey": "", "projectId": "nuestro-espacio-1605"}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : "invictos-web-v3";

        let activeTab = 'home';
        let allItems = [];
        let base64Img = "";
        let audioBlobBase64 = "";
        let mediaRecorder;
        let audioChunks = [];
        let userAuth = null;

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userAuth = user;
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'memories');
                onSnapshot(q, (snap) => {
                    allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderGrid();
                }, (err) => console.error("Sync Error:", err));
            }
        });

        async function compressImage(base64Str, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
            });
        }

        window.changeTab = (tab) => {
            activeTab = tab;
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if(tab === 'home') {
                document.getElementById('tab-home').classList.add('active');
            } else {
                document.getElementById('tab-dynamic').classList.add('active');
                const h = { 
                    gallery: { t: 'Galería', s: 'Nuestros momentos capturados', b: 'Subir Foto' },
                    music: { t: 'Playlist', s: 'Canciones que nos definen', b: 'Añadir Tema' },
                    diary: { t: 'Bitácora', s: 'Pensamientos y susurros', b: 'Nueva Entrada' }
                };
                document.getElementById('page-title').innerText = h[tab].t;
                document.getElementById('page-subtitle').innerText = h[tab].s;
                document.getElementById('btn-text').innerText = h[tab].b;
            }
            updateNav();
            renderGrid();
        };

        function updateNav() {
            document.querySelectorAll('.nav-link, .nav-link-m').forEach(link => {
                const active = link.dataset.tab === activeTab;
                if(link.classList.contains('nav-link')) {
                    link.className = `nav-link w-full flex items-center gap-4 p-5 rounded-[2rem] font-bold transition-all text-sm ${active ? 'sidebar-active' : 'text-slate-400 hover:bg-white hover:shadow-sm'}`;
                } else {
                    link.className = `nav-link-m p-4 rounded-2xl transition-all ${active ? 'bg-slate-900 text-white shadow-lg scale-110' : 'text-slate-400'}`;
                }
            });
        }

        function renderGrid() {
            if(activeTab === 'home') return;
            const grid = document.getElementById('items-grid');
            grid.innerHTML = '';
            const filtered = allItems
                .filter(m => m.type === activeTab)
                .sort((a,b) => new Date(b.created) - new Date(a.created));
            
            filtered.forEach(m => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-[3rem] border border-slate-100 overflow-hidden shadow-sm hover:shadow-[0_20px_50px_rgba(0,0,0,0.05)] hover:scale-[1.02] transition-all duration-500 animate-fade flex flex-col group relative";
                
                let media = '';
                if(m.type === 'music') {
                    media = `<div class="p-12 bg-slate-900 flex flex-col items-center justify-center text-center space-y-6 relative overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-br from-rose-500/20 to-transparent opacity-50"></div>
                        <div class="w-16 h-16 bg-white/10 backdrop-blur rounded-full flex items-center justify-center text-white relative z-10"><i data-lucide="play" fill="currentColor"></i></div>
                        <a href="${m.url}" target="_blank" class="bg-rose-500 text-white px-8 py-3 rounded-full text-[10px] font-black uppercase tracking-widest relative z-10 hover:bg-rose-400 transition-colors">Escuchar ahora</a>
                    </div>`;
                } else if(m.image) {
                    media = `<div class="aspect-square overflow-hidden bg-slate-50 cursor-zoom-in" onclick="openLightbox('${m.image}')">
                        <img src="${m.image}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    </div>`;
                }

                card.innerHTML = `
                    <div class="absolute top-6 right-6 flex gap-2 z-20 opacity-0 group-hover:opacity-100 transition-all transform translate-y-2 group-hover:translate-y-0">
                        <button onclick="deleteItem('${m.id}')" class="w-10 h-10 bg-white shadow-xl rounded-full flex items-center justify-center text-rose-500 hover:bg-rose-500 hover:text-white transition-all"><i data-lucide="trash-2" size="16"></i></button>
                    </div>
                    ${media}
                    ${m.audio ? `<div class="p-6 bg-slate-50 border-b border-slate-100"><audio controls src="${m.audio}" class="w-full h-8"></audio></div>` : ''}
                    <div class="p-10">
                        <div class="flex items-center gap-2 mb-4">
                            <span class="w-8 h-[1px] bg-rose-200"></span>
                            <span class="text-[10px] font-black text-rose-400 uppercase tracking-widest">${new Date(m.created).toLocaleDateString('es-ES', { day:'2-digit', month:'short' })}</span>
                        </div>
                        <h4 class="text-xl font-black uppercase italic tracking-tighter mb-4 text-slate-900 leading-tight">${m.title}</h4>
                        <p class="text-slate-500 text-sm leading-relaxed line-clamp-3 font-medium">${m.content}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        // --- FUNCIONES DE SOPORTE (Idénticas pero con mejoras visuales en feedback) ---
        
        document.getElementById('save-form').onsubmit = async (e) => {
            e.preventDefault();
            if(!userAuth) return;
            const loader = document.getElementById('modal-loader');
            const submitBtn = document.getElementById('submit-btn');
            loader.style.display = 'flex';
            submitBtn.disabled = true;
            try {
                let compressed = "";
                if(base64Img) compressed = await compressImage(base64Img);
                const data = {
                    type: activeTab,
                    title: document.getElementById('in-title').value,
                    url: document.getElementById('in-url').value || "",
                    content: document.getElementById('in-desc').value,
                    created: new Date().toISOString(),
                    image: compressed,
                    audio: audioBlobBase64
                };
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'memories'), data);
                closeModal();
            } catch (err) {
                console.error("Save Error:", err);
            } finally {
                loader.style.display = 'none';
                submitBtn.disabled = false;
            }
        };

        window.deleteItem = async (id) => {
            if(confirm('¿Seguro que quieres borrar este recuerdo?')) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'memories', id));
            }
        };

        window.openModal = () => {
            document.getElementById('item-modal').classList.remove('hidden');
            document.getElementById('music-fields').classList.toggle('hidden', activeTab !== 'music');
            document.getElementById('diary-fields').classList.toggle('hidden', activeTab !== 'diary');
            document.getElementById('photo-upload').classList.toggle('hidden', activeTab === 'music');
            document.getElementById('modal-title').innerText = 
                activeTab === 'gallery' ? 'Nueva Foto' : 
                activeTab === 'music' ? 'Nueva Canción' : 'Nueva Nota';
        };

        window.closeModal = () => {
            document.getElementById('item-modal').classList.add('hidden');
            document.getElementById('save-form').reset();
            base64Img = ""; audioBlobBase64 = "";
            document.getElementById('audio-preview-container').classList.add('hidden');
            document.getElementById('file-status').innerText = "Seleccionar Foto";
        };

        document.getElementById('in-file').onchange = (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = ev => {
                    base64Img = ev.target.result;
                    document.getElementById('file-status').innerText = "✨ ¡Imagen lista!";
                };
                reader.readAsDataURL(file);
            }
        };

        const recordBtn = document.getElementById('record-btn');
        recordBtn.onclick = async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            audioBlobBase64 = reader.result;
                            document.getElementById('audio-preview').src = audioBlobBase64;
                            document.getElementById('audio-preview-container').classList.remove('hidden');
                            document.getElementById('record-status').innerText = "¡Audio grabado con éxito!";
                        };
                        reader.readAsDataURL(blob);
                    };
                    mediaRecorder.start();
                    recordBtn.classList.add('recording-pulse');
                    document.getElementById('record-status').innerText = "Grabando... (Click para parar)";
                } catch(e) { alert("Necesitas dar permiso al micrófono"); }
            } else {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording-pulse');
            }
        };

        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            const pass = document.getElementById('password-input').value.toLowerCase().trim();
            if(['invictos', '1605'].includes(pass)) {
                document.getElementById('login-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    initAuth();
                    startClocks();
                    startTimer();
                    lucide.createIcons();
                }, 400);
            } else {
                document.getElementById('error-message').classList.remove('hidden');
            }
        };

        function startClocks() {
            setInterval(() => {
                const now = new Date();
                const opt = { hour: '2-digit', minute: '2-digit', hour12: true };
                document.getElementById('clock-lima').innerText = now.toLocaleTimeString('en-US', { ...opt, timeZone: 'America/Lima' });
                document.getElementById('clock-guanare').innerText = now.toLocaleTimeString('en-US', { ...opt, timeZone: 'America/Caracas' });
            }, 1000);
        }

        function startTimer() {
            const start = new Date('2025-05-16T00:00:00');
            setInterval(() => {
                const diff = Math.floor((new Date() - start) / 1000);
                document.getElementById('days').innerText = Math.floor(diff / 86400).toString().padStart(2, '0');
                document.getElementById('hours').innerText = Math.floor((diff % 86400) / 3600).toString().padStart(2, '0');
                document.getElementById('minutes').innerText = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
            }, 1000);
        }

        window.openLightbox = (src) => {
            const lb = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            lb.style.display = 'flex';
            setTimeout(() => {
                lb.style.opacity = '1';
                img.style.transform = 'scale(1)';
            }, 10);
        };
        window.closeLightbox = () => {
            const lb = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            lb.style.opacity = '0';
            img.style.transform = 'scale(0.9)';
            setTimeout(() => lb.style.display = 'none', 400);
        };

        // Generador de corazones mejorado
        setInterval(() => {
            const container = document.getElementById('hearts-container');
            if(container.children.length > 15) return;
            const h = document.createElement('div');
            h.className = 'heart-particle';
            h.innerHTML = '❤';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = (Math.random() * 20 + 10) + 'px';
            h.style.animationDuration = (Math.random() * 3 + 4) + 's';
            container.appendChild(h);
            setTimeout(() => h.remove(), 7000);
        }, 800);
    </script>
</body>
</html>
