<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Espacio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; scroll-behavior: smooth; }
        .font-romance { font-family: 'Dancing Script', cursive; }
        .font-serif-bold { font-family: 'Playfair Display', serif; }
        
        .sidebar-active { background: #0f172a; color: white; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.6s ease-out forwards; }
        
        .heart-particle {
            position: fixed;
            top: -20px;
            color: #fb7185;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            animation: fall linear forwards;
            opacity: 0.3;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .recording-pulse {
            animation: pulse-red 1.5s infinite;
            background-color: #e11d48 !important;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }

        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            z-index: 200;
            cursor: zoom-out;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        audio::-webkit-media-controls-panel { background-color: #f8fafc; }
        
        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.9);
            z-index: 50;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: inherit;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div id="hearts-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Vista expandida">
    </div>

    <!-- PANTALLA DE INICIO MODIFICADA -->
    <div id="login-screen" class="fixed inset-0 z-[100] bg-white flex items-center justify-center p-6">
        <div class="max-w-md w-full text-center space-y-10 animate-fade">
            <div class="w-20 h-20 bg-slate-50 text-rose-500 rounded-3xl flex items-center justify-center mx-auto shadow-sm">
                <i data-lucide="heart" size="28" fill="currentColor"></i>
            </div>
            <div class="space-y-3">
                <h1 class="text-4xl font-black tracking-tighter uppercase italic text-slate-900 flex items-center justify-center gap-2">
                    Nuestro Espacio <i data-lucide="heart" class="text-rose-500" fill="currentColor" size="24"></i>
                </h1>
                <p class="text-slate-400 font-bold text-[10px] uppercase tracking-[0.4em]">Acceso Privado</p>
            </div>
            <form id="login-form" class="space-y-4">
                <input type="password" id="password-input" placeholder="Clave Especial" 
                    class="w-full bg-slate-50 p-6 rounded-[2rem] border border-slate-100 focus:border-slate-300 outline-none transition-all text-center font-bold placeholder:text-slate-300">
                <button type="submit" class="w-full bg-slate-900 text-white font-black py-6 rounded-[2rem] hover:bg-black transition-all uppercase tracking-widest text-xs shadow-lg">
                    Entrar
                </button>
                <p id="error-message" class="hidden text-rose-500 text-[11px] font-black uppercase tracking-widest mt-4">No es la clave, mi amor</p>
            </form>
        </div>
    </div>

    <div id="main-app" class="hidden flex min-h-screen relative z-10">
        <aside class="hidden lg:flex flex-col w-72 fixed left-0 top-0 bottom-0 bg-white border-r border-slate-100 p-10 z-40">
            <div class="mb-16">
                <span class="text-2xl font-black italic tracking-tighter text-slate-900">Invictos</span>
            </div>
            <nav class="flex-1 space-y-2">
                <button onclick="changeTab('home')" class="nav-link w-full flex items-center gap-4 p-5 rounded-2xl font-bold transition-all text-sm group" data-tab="home">
                    <i data-lucide="layout-grid" size="18"></i> <span>Dashboard</span>
                </button>
                <button onclick="changeTab('gallery')" class="nav-link w-full flex items-center gap-4 p-5 rounded-2xl font-bold transition-all text-sm group" data-tab="gallery">
                    <i data-lucide="image" size="18"></i> <span>Galería</span>
                </button>
                <button onclick="changeTab('music')" class="nav-link w-full flex items-center gap-4 p-5 rounded-2xl font-bold transition-all text-sm group" data-tab="music">
                    <i data-lucide="music-4" size="18"></i> <span>Carpeta Musical</span>
                </button>
                <button onclick="changeTab('diary')" class="nav-link w-full flex items-center gap-4 p-5 rounded-2xl font-bold transition-all text-sm group" data-tab="diary">
                    <i data-lucide="mic" size="18"></i> <span>Diario & Audios</span>
                </button>
            </nav>
        </aside>

        <nav class="lg:hidden fixed bottom-6 left-6 right-6 bg-white border border-slate-100 shadow-2xl rounded-[2.5rem] flex justify-around p-3 z-50">
            <button onclick="changeTab('home')" class="nav-link-m p-4 rounded-2xl transition-all" data-tab="home"><i data-lucide="layout-grid" size="20"></i></button>
            <button onclick="changeTab('gallery')" class="nav-link-m p-4 rounded-2xl transition-all" data-tab="gallery"><i data-lucide="image" size="20"></i></button>
            <button onclick="changeTab('music')" class="nav-link-m p-4 rounded-2xl transition-all" data-tab="music"><i data-lucide="music-4" size="20"></i></button>
            <button onclick="changeTab('diary')" class="nav-link-m p-4 rounded-2xl transition-all" data-tab="diary"><i data-lucide="mic" size="20"></i></button>
        </nav>

        <main class="flex-1 lg:pl-72 bg-transparent min-h-screen relative">
            <section id="tab-home" class="tab-content active p-6 lg:p-12 h-screen overflow-y-auto">
                <div class="max-w-4xl mx-auto flex flex-col items-center justify-center min-h-full text-center space-y-12 animate-fade">
                    <div class="flex gap-8 md:gap-16 justify-center items-center bg-white/60 backdrop-blur-md p-6 rounded-[2.5rem] border border-white shadow-sm w-full max-w-2xl">
                        <div class="flex flex-col">
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Lima, Perú</span>
                            <span id="clock-lima" class="text-3xl font-black text-slate-900 tracking-tighter">--:-- --</span>
                        </div>
                        <div class="h-10 w-px bg-slate-200"></div>
                        <div class="flex flex-col">
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Guanare, Ven</span>
                            <span id="clock-guanare" class="text-3xl font-black text-slate-900 tracking-tighter">--:-- --</span>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <h2 class="text-6xl md:text-8xl font-serif-bold italic tracking-tighter text-slate-900 leading-tight">Evelyn y Juan</h2>
                        <div class="inline-flex items-center gap-2 bg-white px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-[0.4em] text-rose-500 shadow-sm border border-slate-100">
                            TIEMPO DE SER INVICTOS
                        </div>
                        <div id="countdown" class="flex gap-4 md:gap-10 justify-center items-center">
                            <div class="flex flex-col"><span id="days" class="text-5xl md:text-7xl font-black text-slate-900 tracking-tighter">00</span><span class="text-[10px] font-black text-slate-400 uppercase mt-2 tracking-widest">Días</span></div>
                            <div class="flex flex-col"><span id="hours" class="text-5xl md:text-7xl font-black text-slate-900 tracking-tighter">00</span><span class="text-[10px] font-black text-slate-400 uppercase mt-2 tracking-widest">Horas</span></div>
                            <div class="flex flex-col"><span id="minutes" class="text-5xl md:text-7xl font-black text-slate-900 tracking-tighter">00</span><span class="text-[10px] font-black text-slate-400 uppercase mt-2 tracking-widest">Mins</span></div>
                            <div class="flex flex-col"><span id="seconds" class="text-5xl md:text-7xl font-black text-rose-500 opacity-30 tracking-tighter">00</span><span class="text-[10px] font-black text-slate-400 uppercase mt-2 tracking-widest">Segs</span></div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="tab-dynamic" class="tab-content p-6 lg:p-20 h-screen overflow-y-auto">
                <div class="max-w-5xl mx-auto">
                    <header class="flex flex-col md:flex-row md:items-end justify-between gap-8 mb-16 animate-fade">
                        <div class="space-y-2">
                            <h2 id="page-title" class="text-6xl font-black tracking-tighter uppercase italic text-slate-900 leading-none">Título</h2>
                            <p id="page-subtitle" class="text-slate-400 font-bold text-[10px] uppercase tracking-[0.4em]">Subtítulo</p>
                        </div>
                        <button onclick="openModal()" class="flex items-center gap-4 bg-slate-900 text-white px-10 py-5 rounded-[2.5rem] font-black text-[11px] uppercase tracking-widest hover:bg-black transition-all shadow-xl">
                            <i data-lucide="plus" size="18"></i> <span id="btn-text">Agregar</span>
                        </button>
                    </header>
                    <div id="items-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-32"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="item-modal" class="hidden fixed inset-0 z-[100] bg-slate-900/10 backdrop-blur-md flex items-center justify-center p-6">
        <div class="bg-white rounded-[3.5rem] w-full max-w-xl p-10 shadow-2xl space-y-8 animate-fade overflow-y-auto max-h-[90vh] border border-slate-100 relative">
            
            <div id="modal-loader" class="loading-overlay">
                <div class="w-12 h-12 border-4 border-slate-100 border-t-slate-900 rounded-full animate-spin mb-4"></div>
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-900">Optimizando Recuerdo...</p>
            </div>

            <div class="flex justify-between items-center">
                <h3 id="modal-title" class="text-2xl font-black tracking-tighter uppercase italic">Nuevo Recuerdo</h3>
                <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 hover:text-slate-900 transition-colors"><i data-lucide="x" size="20"></i></button>
            </div>
            
            <form id="save-form" class="space-y-6">
                <input type="hidden" id="edit-id">
                <input id="in-title" required placeholder="Título del recuerdo" class="w-full bg-slate-50 p-6 rounded-3xl border border-slate-100 outline-none font-bold">
                
                <div id="music-fields" class="hidden">
                    <input id="in-url" placeholder="Enlace de YouTube o Spotify" class="w-full bg-slate-50 p-6 rounded-3xl border border-slate-100 outline-none font-bold">
                </div>

                <div id="diary-fields" class="hidden">
                    <div class="flex items-center gap-4 p-4 bg-slate-50 rounded-3xl border border-slate-100 mb-4">
                        <button type="button" id="record-btn" class="w-16 h-16 rounded-full bg-rose-500 text-white flex items-center justify-center shadow-lg hover:scale-105 transition-transform">
                            <i data-lucide="mic" id="mic-icon"></i>
                        </button>
                        <div class="flex-1">
                            <span id="record-status" class="text-[10px] font-black uppercase tracking-widest text-slate-400">¿Grabar una nota de voz?</span>
                            <div id="audio-preview-container" class="hidden mt-2">
                                <audio id="audio-preview" controls class="h-8 w-full"></audio>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="photo-upload">
                    <label class="flex flex-col items-center justify-center gap-3 w-full bg-slate-50 p-10 rounded-[2.5rem] border-2 border-dashed border-slate-200 cursor-pointer hover:border-slate-400 transition-all">
                        <i data-lucide="camera" class="text-slate-300" size="32"></i>
                        <span id="file-status" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-2">Subir Foto</span>
                        <input id="in-file" type="file" accept="image/*" class="hidden">
                    </label>
                </div>

                <textarea id="in-desc" placeholder="Escribe tu mensaje aquí..." class="w-full bg-slate-50 p-6 rounded-3xl border border-slate-100 outline-none font-bold h-32 resize-none"></textarea>
                
                <button type="submit" id="submit-btn" class="w-full bg-slate-900 text-white py-6 rounded-3xl font-black text-[10px] uppercase tracking-[0.2em] shadow-xl hover:bg-black transition-all">Guardar Recuerdo</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{"apiKey": "", "projectId": "nuestro-espacio-1605"}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : "invictos-web-v3";

        let activeTab = 'home';
        let allItems = [];
        let base64Img = "";
        let audioBlobBase64 = "";
        let mediaRecorder;
        let audioChunks = [];
        let userAuth = null;

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userAuth = user;
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'memories');
                onSnapshot(q, (snap) => {
                    allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderGrid();
                }, (err) => console.error("Sync Error:", err));
            }
        });

        async function compressImage(base64Str, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
            });
        }

        window.changeTab = (tab) => {
            activeTab = tab;
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if(tab === 'home') {
                document.getElementById('tab-home').classList.add('active');
            } else {
                document.getElementById('tab-dynamic').classList.add('active');
                const h = { 
                    gallery: { t: 'Galería', s: 'Nuestros momentos', b: 'Subir Foto' },
                    music: { t: 'Música', s: 'Nuestros temas', b: 'Añadir Tema' },
                    diary: { t: 'Diario', s: 'Notas del alma', b: 'Nueva Entrada' }
                };
                document.getElementById('page-title').innerText = h[tab].t;
                document.getElementById('page-subtitle').innerText = h[tab].s;
                document.getElementById('btn-text').innerText = h[tab].b;
            }
            updateNav();
            renderGrid();
        };

        function updateNav() {
            document.querySelectorAll('.nav-link, .nav-link-m').forEach(link => {
                const active = link.dataset.tab === activeTab;
                if(link.classList.contains('nav-link')) {
                    link.className = `nav-link w-full flex items-center gap-4 p-5 rounded-2xl font-bold transition-all text-sm ${active ? 'sidebar-active shadow-lg' : 'text-slate-400 hover:bg-slate-50'}`;
                } else {
                    link.className = `nav-link-m p-4 rounded-2xl transition-all ${active ? 'bg-slate-900 text-white shadow-lg scale-110' : 'text-slate-400'}`;
                }
            });
        }

        function renderGrid() {
            if(activeTab === 'home') return;
            const grid = document.getElementById('items-grid');
            grid.innerHTML = '';
            const filtered = allItems
                .filter(m => m.type === activeTab)
                .sort((a,b) => new Date(b.created) - new Date(a.created));
            filtered.forEach(m => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden shadow-sm hover:shadow-xl transition-all animate-fade flex flex-col group relative";
                let media = '';
                if(m.type === 'music') {
                    media = `<div class="p-10 bg-slate-900 flex flex-col items-center justify-center text-center space-y-4">
                        <div class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center text-white"><i data-lucide="play"></i></div>
                        <a href="${m.url}" target="_blank" class="bg-rose-500 text-white px-6 py-2 rounded-full text-[9px] font-black uppercase">Escuchar</a>
                    </div>`;
                } else if(m.image) {
                    media = `<div class="aspect-square overflow-hidden bg-slate-50 cursor-zoom-in" onclick="openLightbox('${m.image}')">
                        <img src="${m.image}" class="w-full h-full object-cover">
                    </div>`;
                }
                card.innerHTML = `
                    <div class="absolute top-4 right-4 flex gap-2 z-20 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="deleteItem('${m.id}')" class="w-8 h-8 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-rose-500 shadow-md"><i data-lucide="trash-2" size="14"></i></button>
                    </div>
                    ${media}
                    ${m.audio ? `<div class="p-4 bg-slate-50 border-b border-slate-100"><audio controls src="${m.audio}" class="w-full h-8"></audio></div>` : ''}
                    <div class="p-8">
                        <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest block mb-2">${new Date(m.created).toLocaleDateString()}</span>
                        <h4 class="text-lg font-black uppercase italic tracking-tighter mb-2 text-slate-900">${m.title}</h4>
                        <p class="text-slate-500 text-xs leading-relaxed line-clamp-3">${m.content}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        document.getElementById('save-form').onsubmit = async (e) => {
            e.preventDefault();
            if(!userAuth) return;
            const loader = document.getElementById('modal-loader');
            const submitBtn = document.getElementById('submit-btn');
            loader.style.display = 'flex';
            submitBtn.disabled = true;
            try {
                let compressed = "";
                if(base64Img) compressed = await compressImage(base64Img);
                const data = {
                    type: activeTab,
                    title: document.getElementById('in-title').value,
                    url: document.getElementById('in-url').value || "",
                    content: document.getElementById('in-desc').value,
                    created: new Date().toISOString(),
                    image: compressed,
                    audio: audioBlobBase64
                };
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'memories'), data);
                closeModal();
            } catch (err) {
                console.error("Save Error:", err);
            } finally {
                loader.style.display = 'none';
                submitBtn.disabled = false;
            }
        };

        window.deleteItem = async (id) => {
            if(confirm('¿Eliminar?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'memories', id));
        };

        window.openModal = () => {
            document.getElementById('item-modal').classList.remove('hidden');
            document.getElementById('music-fields').classList.toggle('hidden', activeTab !== 'music');
            document.getElementById('diary-fields').classList.toggle('hidden', activeTab !== 'diary');
            document.getElementById('photo-upload').classList.toggle('hidden', activeTab === 'music');
        };

        window.closeModal = () => {
            document.getElementById('item-modal').classList.add('hidden');
            document.getElementById('save-form').reset();
            base64Img = ""; audioBlobBase64 = "";
            document.getElementById('audio-preview-container').classList.add('hidden');
            document.getElementById('file-status').innerText = "Subir Foto";
        };

        document.getElementById('in-file').onchange = (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = ev => {
                    base64Img = ev.target.result;
                    document.getElementById('file-status').innerText = "¡Foto seleccionada!";
                };
                reader.readAsDataURL(file);
            }
        };

        const recordBtn = document.getElementById('record-btn');
        recordBtn.onclick = async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        audioBlobBase64 = reader.result;
                        document.getElementById('audio-preview').src = audioBlobBase64;
                        document.getElementById('audio-preview-container').classList.remove('hidden');
                        document.getElementById('record-status').innerText = "¡Listo!";
                    };
                    reader.readAsDataURL(blob);
                };
                mediaRecorder.start();
                recordBtn.classList.add('recording-pulse');
            } else {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording-pulse');
            }
        };

        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            const pass = document.getElementById('password-input').value.toLowerCase().trim();
            if(['invictos', '1605'].includes(pass)) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                initAuth();
                startClocks();
                startTimer();
                lucide.createIcons();
            } else {
                document.getElementById('error-message').classList.remove('hidden');
            }
        };

        function startClocks() {
            setInterval(() => {
                const now = new Date();
                const opt = { hour: '2-digit', minute: '2-digit', hour12: true };
                document.getElementById('clock-lima').innerText = now.toLocaleTimeString('en-US', { ...opt, timeZone: 'America/Lima' });
                document.getElementById('clock-guanare').innerText = now.toLocaleTimeString('en-US', { ...opt, timeZone: 'America/Caracas' });
            }, 1000);
        }

        function startTimer() {
            const start = new Date('2025-05-16T00:00:00');
            setInterval(() => {
                const diff = Math.floor((new Date() - start) / 1000);
                document.getElementById('days').innerText = Math.floor(diff / 86400).toString().padStart(2, '0');
                document.getElementById('hours').innerText = Math.floor((diff % 86400) / 3600).toString().padStart(2, '0');
                document.getElementById('minutes').innerText = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
                document.getElementById('seconds').innerText = Math.floor(diff % 60).toString().padStart(2, '0');
            }, 1000);
        }

        window.openLightbox = (src) => {
            const lb = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = src;
            lb.style.display = 'flex';
            setTimeout(() => lb.style.opacity = '1', 10);
        };
        window.closeLightbox = () => {
            const lb = document.getElementById('lightbox');
            lb.style.opacity = '0';
            setTimeout(() => lb.style.display = 'none', 300);
        };
    </script>
</body>
</html>
