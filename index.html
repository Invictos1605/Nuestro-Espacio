<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Espacio | Invictos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose-soft: #fff1f2;
            --rose-vibrant: #fb7185;
            --slate-deep: #0f172a;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden; 
            scroll-behavior: smooth;
            background-color: #fcfcfd;
        }

        .font-serif-luxury { font-family: 'Playfair Display', serif; }
        .font-cursive { font-family: 'Instrument Serif', serif; font-style: italic; }
        
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .glass-dark {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-reveal { animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .animate-pulse-soft { animation: pulse-soft 3s infinite ease-in-out; }

        .nav-link.active {
            background: var(--slate-deep);
            color: white;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.2);
        }

        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            transition: all 0.4s ease;
        }
        .card-shadow:hover {
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05);
            transform: translateY(-4px);
        }

        .login-input {
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .login-input:focus {
            background: white;
            border-color: var(--rose-vibrant);
            box-shadow: 0 0 0 4px rgba(251, 113, 133, 0.1);
        }

        .tab-content { display: none; opacity: 0; }
        .tab-content.active { display: block; opacity: 1; animation: reveal 0.6s ease-out; }

        .heart-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            animation: float-up linear forwards;
        }
        @keyframes float-up {
            to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="text-slate-900">

    <div class="fixed inset-0 z-0 opacity-40 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-rose-100 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-50 rounded-full blur-[120px]"></div>
    </div>

    <div id="lightbox" onclick="closeLightbox()" class="fixed inset-0 z-[200] hidden bg-slate-900/95 backdrop-blur-xl cursor-zoom-out items-center justify-center p-4 transition-opacity duration-300">
        <img id="lightbox-img" src="" class="max-w-full max-h-[90vh] rounded-2xl shadow-2xl object-contain">
    </div>

    <div id="login-screen" class="fixed inset-0 z-[100] bg-white flex items-center justify-center p-6 transition-opacity duration-500">
        <div class="max-w-sm w-full text-center space-y-12 animate-reveal">
            <div class="relative inline-block">
                <div class="w-24 h-24 bg-slate-950 rounded-[2.5rem] flex items-center justify-center mx-auto rotate-12">
                    <i data-lucide="heart" class="text-rose-400 fill-rose-400 animate-pulse-soft" size="32"></i>
                </div>
            </div>
            
            <div class="space-y-4">
                <h1 class="text-4xl font-bold tracking-tight text-slate-950 font-serif-luxury">Invictos</h1>
                <p class="text-[10px] uppercase tracking-[0.5em] text-slate-400 font-semibold">Memoria Digital Privada</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div class="relative">
                    <input type="password" id="password-input" placeholder="Introduce nuestra clave..." 
                        class="login-input w-full px-8 py-6 rounded-[2rem] outline-none text-center font-medium placeholder:text-slate-300">
                </div>
                <button type="submit" id="login-btn" class="w-full bg-slate-950 text-white font-bold py-6 rounded-[2rem] hover:bg-black transition-all text-[11px] uppercase tracking-[0.2em] shadow-xl active:scale-[0.98]">
                    Acceder al Espacio
                </button>
                <p id="error-message" class="hidden text-rose-500 text-[10px] font-bold uppercase tracking-widest pt-4">Clave incorrecta</p>
            </form>
        </div>
    </div>

    <div id="main-app" class="hidden flex min-h-screen relative z-10">
        <aside class="hidden lg:flex flex-col w-80 fixed left-0 top-0 bottom-0 bg-white/50 backdrop-blur-md border-r border-slate-100 p-12 z-40">
            <div class="mb-20">
                <span class="text-3xl font-serif-luxury italic text-slate-950">Invictos.</span>
            </div>
            <nav class="flex-1 space-y-3">
                <button onclick="changeTab('home')" class="nav-link w-full flex items-center gap-5 p-5 rounded-2xl font-semibold transition-all text-[13px] group active" data-tab="home">
                    <i data-lucide="layout" size="18"></i> <span>Dashboard</span>
                </button>
                <button onclick="changeTab('gallery')" class="nav-link w-full flex items-center gap-5 p-5 rounded-2xl font-semibold transition-all text-[13px] group" data-tab="gallery">
                    <i data-lucide="camera" size="18"></i> <span>Galería Visual</span>
                </button>
                <button onclick="changeTab('music')" class="nav-link w-full flex items-center gap-5 p-5 rounded-2xl font-semibold transition-all text-[13px] group" data-tab="music">
                    <i data-lucide="disc" size="18"></i> <span>Playlist</span>
                </button>
                <button onclick="changeTab('diary')" class="nav-link w-full flex items-center gap-5 p-5 rounded-2xl font-semibold transition-all text-[13px] group" data-tab="diary">
                    <i data-lucide="pen-tool" size="18"></i> <span>El Diario</span>
                </button>
            </nav>
            
            <div class="pt-10 border-t border-slate-100">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-rose-100 flex items-center justify-center text-rose-500">
                        <i data-lucide="user" size="14"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-900">Evelyn & Juan</p>
                        <p class="text-[9px] text-slate-400 uppercase tracking-tighter">Desde Mayo 2025</p>
                    </div>
                </div>
            </div>
        </aside>

        <nav class="lg:hidden fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] glass border border-white/50 shadow-2xl rounded-[2.5rem] flex justify-around p-3 z-50">
            <button onclick="changeTab('home')" class="nav-link-m p-5 rounded-full transition-all bg-slate-950 text-white shadow-xl scale-110" data-tab="home"><i data-lucide="layout" size="20"></i></button>
            <button onclick="changeTab('gallery')" class="nav-link-m p-5 rounded-full transition-all text-slate-400" data-tab="gallery"><i data-lucide="camera" size="20"></i></button>
            <button onclick="changeTab('music')" class="nav-link-m p-5 rounded-full transition-all text-slate-400" data-tab="music"><i data-lucide="disc" size="20"></i></button>
            <button onclick="changeTab('diary')" class="nav-link-m p-5 rounded-full transition-all text-slate-400" data-tab="diary"><i data-lucide="pen-tool" size="20"></i></button>
        </nav>

        <main class="flex-1 lg:pl-80 min-h-screen relative">
            <section id="tab-home" class="tab-content active p-8 lg:p-20 flex flex-col items-center justify-center min-h-screen text-center">
                <div class="max-w-4xl w-full space-y-20 animate-reveal">
                    
                    <div class="flex flex-wrap gap-6 md:gap-12 justify-center items-center glass p-8 rounded-[3rem] shadow-sm">
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-2">Lima</span>
                            <span id="clock-lima" class="text-4xl font-light tracking-tighter text-slate-950">00:00</span>
                        </div>
                        <div class="h-8 w-px bg-slate-100 hidden md:block"></div>
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-2">Guanare</span>
                            <span id="clock-guanare" class="text-4xl font-light tracking-tighter text-slate-950">00:00</span>
                        </div>
                    </div>

                    <div class="space-y-8">
                        <h2 class="text-7xl md:text-[9rem] font-serif-luxury italic tracking-tighter leading-none text-slate-950">
                            E<span class="font-cursive text-rose-400 text-[0.8em]">&</span>J
                        </h2>
                        <p class="text-[11px] font-bold tracking-[0.6em] text-rose-500 uppercase">Juntos desde siempre</p>
                    </div>

                    <div id="countdown" class="grid grid-cols-2 md:grid-cols-4 gap-8 md:gap-4 max-w-3xl mx-auto">
                        <div class="space-y-1">
                            <span id="days" class="text-6xl md:text-7xl font-light tracking-tighter block text-slate-950">00</span>
                            <span class="text-[9px] font-bold text-slate-300 uppercase tracking-widest">Días</span>
                        </div>
                        <div class="space-y-1">
                            <span id="hours" class="text-6xl md:text-7xl font-light tracking-tighter block text-slate-950">00</span>
                            <span class="text-[9px] font-bold text-slate-300 uppercase tracking-widest">Horas</span>
                        </div>
                        <div class="space-y-1">
                            <span id="minutes" class="text-6xl md:text-7xl font-light tracking-tighter block text-slate-950">00</span>
                            <span class="text-[9px] font-bold text-slate-300 uppercase tracking-widest">Minutos</span>
                        </div>
                        <div class="space-y-1">
                            <span id="seconds" class="text-6xl md:text-7xl font-light tracking-tighter block text-rose-200">00</span>
                            <span class="text-[9px] font-bold text-rose-200 uppercase tracking-widest">Segundos</span>
                        </div>
                    </div>
                </div>
            </section>

            <section id="tab-dynamic" class="tab-content p-8 lg:p-20 h-screen overflow-y-auto">
                <div class="max-w-6xl mx-auto pb-32">
                    <header class="flex flex-col md:flex-row md:items-center justify-between gap-8 mb-20">
                        <div class="space-y-2">
                            <h2 id="page-title" class="text-5xl font-serif-luxury italic text-slate-950">Sección</h2>
                            <p id="page-subtitle" class="text-slate-400 text-[11px] font-bold uppercase tracking-[0.3em]">Explorar recuerdos</p>
                        </div>
                        <button onclick="openModal()" class="group flex items-center gap-4 bg-slate-950 text-white pl-8 pr-10 py-5 rounded-full font-bold text-[11px] uppercase tracking-widest hover:bg-black transition-all shadow-xl active:scale-95">
                            <i data-lucide="plus" size="18" class="group-hover:rotate-90 transition-transform"></i>
                            <span id="btn-text">Agregar</span>
                        </button>
                    </header>
                    <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="item-modal" class="hidden fixed inset-0 z-[100] glass-dark flex items-center justify-center p-4">
        <div class="bg-white rounded-[3rem] w-full max-w-xl p-10 md:p-12 shadow-2xl space-y-10 animate-reveal overflow-y-auto max-h-[90vh] relative">
            <div id="modal-loader" class="hidden absolute inset-0 bg-white/90 z-50 flex flex-col items-center justify-center">
                <div class="w-10 h-10 border-2 border-slate-100 border-t-slate-900 rounded-full animate-spin mb-4"></div>
                <p class="text-[10px] font-bold uppercase tracking-[0.2em]">Guardando momento...</p>
            </div>

            <div class="flex justify-between items-center">
                <h3 id="modal-title" class="text-3xl font-serif-luxury italic">Nuevo Recuerdo</h3>
                <button onclick="closeModal()" class="w-12 h-12 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 hover:text-slate-950 transition-colors"><i data-lucide="x" size="20"></i></button>
            </div>
            
            <form id="save-form" class="space-y-8">
                <input id="in-title" required placeholder="Nombra este momento..." class="w-full bg-slate-50 p-6 rounded-2xl border border-slate-100 outline-none font-semibold focus:border-slate-300">
                
                <div id="music-fields" class="hidden">
                    <input id="in-url" placeholder="URL de Spotify o YouTube..." class="w-full bg-slate-50 p-6 rounded-2xl border border-slate-100 outline-none font-semibold">
                </div>

                <div id="diary-fields" class="hidden">
                    <div class="flex items-center gap-6 p-6 bg-slate-50 rounded-[2rem] border border-slate-100">
                        <button type="button" id="record-btn" class="w-16 h-16 rounded-full bg-rose-500 text-white flex items-center justify-center shadow-lg transition-transform hover:scale-105 active:scale-95">
                            <i data-lucide="mic" id="mic-icon"></i>
                        </button>
                        <div class="flex-1">
                            <span id="record-status" class="text-[10px] font-bold uppercase tracking-widest text-slate-400 italic">Captura un audio...</span>
                            <div id="audio-preview-container" class="hidden mt-3">
                                <audio id="audio-preview" controls class="h-8 w-full"></audio>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="photo-upload">
                    <label class="flex flex-col items-center justify-center gap-4 w-full bg-slate-50 p-12 rounded-[2.5rem] border-2 border-dashed border-slate-200 cursor-pointer hover:bg-slate-100 hover:border-slate-300 transition-all">
                        <div class="w-14 h-14 rounded-full bg-white flex items-center justify-center shadow-sm">
                            <i data-lucide="image" class="text-slate-400" size="24"></i>
                        </div>
                        <span id="file-status" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Añadir Imagen</span>
                        <input id="in-file" type="file" accept="image/*" class="hidden">
                    </label>
                </div>

                <textarea id="in-desc" placeholder="Escribe lo que sientes..." class="w-full bg-slate-50 p-8 rounded-[2rem] border border-slate-100 outline-none font-medium h-40 resize-none focus:border-slate-300"></textarea>
                
                <button type="submit" id="submit-btn" class="w-full bg-slate-950 text-white py-6 rounded-full font-bold text-[11px] uppercase tracking-[0.3em] shadow-xl hover:bg-black transition-all">Preservar Recuerdo</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "", projectId: "nuestro-espacio-1605" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : "invictos-web-v3";

        let activeTab = 'home';
        let allItems = [];
        let base64Img = "";
        let audioBlobBase64 = "";
        let mediaRecorder;
        let audioChunks = [];
        let userAuth = null;
        let unsubscribeSnap = null;

        // Login Handler Mejorado
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('password-input').value.toLowerCase().trim();
            const btn = document.getElementById('login-btn');
            
            if(['invictos', '1605'].includes(pass)) {
                btn.disabled = true;
                btn.innerText = "Conectando...";
                
                try {
                    // Primero autenticamos, luego esperamos la señal de onAuthStateChanged
                    await signInAnonymously(auth);
                } catch (err) {
                    console.error("Auth error", err);
                    btn.disabled = false;
                    btn.innerText = "Acceder al Espacio";
                }
            } else {
                document.getElementById('error-message').classList.remove('hidden');
            }
        });

        // Manejador Central de Auth
        onAuthStateChanged(auth, (user) => {
            if (user) {
                userAuth = user;
                // Ocultar login y mostrar app
                document.getElementById('login-screen').classList.add('opacity-0');
                setTimeout(() => {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    lucide.createIcons();
                    startSync();
                }, 500);
            }
        });

        function startSync() {
            if (!userAuth) return;
            
            // Seguir estrictamente la regla de ruta pública /artifacts/{appId}/public/data/{collection}
            const memoriesRef = collection(db, 'artifacts', appId, 'public', 'data', 'memories');
            
            if (unsubscribeSnap) unsubscribeSnap();
            
            unsubscribeSnap = onSnapshot(memoriesRef, (snap) => {
                allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderGrid();
            }, (err) => {
                console.error("Firestore Permission Error:", err);
            });
        }

        window.changeTab = (tab) => {
            activeTab = tab;
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if(tab === 'home') {
                document.getElementById('tab-home').classList.add('active');
            } else {
                document.getElementById('tab-dynamic').classList.add('active');
                const meta = {
                    gallery: { t: 'Galería', s: 'Nuestros momentos visuales', b: 'Añadir Foto' },
                    music: { t: 'Playlist', s: 'Canciones que nos definen', b: 'Añadir Tema' },
                    diary: { t: 'Diario', s: 'Nuestras cartas y notas', b: 'Escribir Nota' }
                };
                document.getElementById('page-title').innerText = meta[tab].t;
                document.getElementById('page-subtitle').innerText = meta[tab].s;
                document.getElementById('btn-text').innerText = meta[tab].b;
            }
            updateNav();
            renderGrid();
        };

        function updateNav() {
            document.querySelectorAll('.nav-link, .nav-link-m').forEach(link => {
                const isActive = link.dataset.tab === activeTab;
                link.classList.toggle('active', isActive);
                if(link.classList.contains('nav-link-m')) {
                    link.className = `nav-link-m p-5 rounded-full transition-all ${isActive ? 'bg-slate-950 text-white shadow-xl scale-110' : 'text-slate-400'}`;
                }
            });
        }

        function renderGrid() {
            if(activeTab === 'home') return;
            const grid = document.getElementById('items-grid');
            grid.innerHTML = '';
            
            const filtered = allItems
                .filter(m => m.type === activeTab)
                .sort((a,b) => new Date(b.created) - new Date(a.created));

            filtered.forEach(m => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-[2.5rem] border border-slate-50 overflow-hidden card-shadow group animate-reveal";
                
                let media = '';
                if(m.type === 'music') {
                    media = `<div class="p-12 bg-slate-50 flex flex-col items-center justify-center space-y-6">
                        <div class="w-16 h-16 rounded-full bg-white flex items-center justify-center text-rose-500 shadow-sm"><i data-lucide="music"></i></div>
                        <a href="${m.url}" target="_blank" class="bg-slate-950 text-white px-8 py-3 rounded-full text-[10px] font-bold uppercase tracking-widest hover:bg-black">Abrir Enlace</a>
                    </div>`;
                } else if(m.image) {
                    media = `<div class="aspect-[4/5] overflow-hidden bg-slate-100 cursor-zoom-in" onclick="openLightbox('${m.image}')">
                        <img src="${m.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                    </div>`;
                }

                card.innerHTML = `
                    <div class="relative">
                        <button onclick="deleteItem('${m.id}')" class="absolute top-6 right-6 w-10 h-10 glass rounded-full flex items-center justify-center text-slate-400 hover:text-rose-500 z-20 opacity-0 group-hover:opacity-100 transition-opacity"><i data-lucide="trash-2" size="16"></i></button>
                        ${media}
                        ${m.audio ? `<div class="p-6 bg-slate-50 border-b border-slate-100"><audio controls src="${m.audio}" class="w-full h-8"></audio></div>` : ''}
                        <div class="p-10 space-y-4">
                            <span class="text-[9px] font-bold text-slate-300 uppercase tracking-widest">${new Date(m.created).toLocaleDateString()}</span>
                            <h4 class="text-xl font-serif-luxury italic text-slate-950">${m.title}</h4>
                            <p class="text-slate-400 text-xs leading-relaxed line-clamp-3">${m.content}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        // Timer y Relojes
        function updateTime() {
            const now = new Date();
            const format = (tz) => now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: tz });
            document.getElementById('clock-lima').innerText = format('America/Lima');
            document.getElementById('clock-guanare').innerText = format('America/Caracas');
            
            const start = new Date('2025-05-16T00:00:00');
            const diff = Math.floor((now - start) / 1000);
            document.getElementById('days').innerText = Math.floor(diff / 86400).toString().padStart(2, '0');
            document.getElementById('hours').innerText = Math.floor((diff % 86400) / 3600).toString().padStart(2, '0');
            document.getElementById('minutes').innerText = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
            document.getElementById('seconds').innerText = Math.floor(diff % 60).toString().padStart(2, '0');
        }
        setInterval(updateTime, 1000);
        updateTime();

        window.openModal = () => {
            document.getElementById('item-modal').classList.remove('hidden');
            document.getElementById('music-fields').classList.toggle('hidden', activeTab !== 'music');
            document.getElementById('diary-fields').classList.toggle('hidden', activeTab !== 'diary');
            document.getElementById('photo-upload').classList.toggle('hidden', activeTab === 'music');
            lucide.createIcons();
        };

        window.closeModal = () => {
            document.getElementById('item-modal').classList.add('hidden');
            document.getElementById('save-form').reset();
            base64Img = ""; audioBlobBase64 = "";
            document.getElementById('audio-preview-container').classList.add('hidden');
            document.getElementById('file-status').innerText = "Añadir Imagen";
        };

        document.getElementById('in-file').onchange = (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = ev => {
                    base64Img = ev.target.result;
                    document.getElementById('file-status').innerText = "Imagen Cargada ✅";
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('save-form').onsubmit = async (e) => {
            e.preventDefault();
            if(!userAuth) return;
            const loader = document.getElementById('modal-loader');
            loader.classList.remove('hidden');
            
            const data = {
                type: activeTab,
                title: document.getElementById('in-title').value,
                url: document.getElementById('in-url').value || "",
                content: document.getElementById('in-desc').value,
                created: new Date().toISOString(),
                image: base64Img,
                audio: audioBlobBase64
            };
            
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'memories'), data);
                closeModal();
            } catch(e) { console.error(e); }
            finally { loader.classList.add('hidden'); }
        };

        window.deleteItem = async (id) => {
            if(!userAuth) return;
            if(confirm('¿Borrar este recuerdo?')) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'memories', id));
                } catch(e) { console.error(e); }
            }
        };

        window.openLightbox = (src) => {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.remove('hidden');
            document.getElementById('lightbox').classList.add('flex');
        };
        window.closeLightbox = () => document.getElementById('lightbox').classList.add('hidden');

        document.getElementById('record-btn').onclick = async () => {
            try {
                if (!mediaRecorder || mediaRecorder.state === "inactive") {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            audioBlobBase64 = reader.result;
                            document.getElementById('audio-preview').src = audioBlobBase64;
                            document.getElementById('audio-preview-container').classList.remove('hidden');
                        };
                        reader.readAsDataURL(blob);
                    };
                    mediaRecorder.start();
                    document.getElementById('record-btn').classList.add('bg-red-500');
                    document.getElementById('record-status').innerText = "Grabando...";
                } else {
                    mediaRecorder.stop();
                    document.getElementById('record-btn').classList.remove('bg-red-500');
                    document.getElementById('record-status').innerText = "Grabación lista";
                }
            } catch(err) {
                console.error("Mic error", err);
            }
        };

        function createHeart() {
            const container = document.body;
            const heart = document.createElement('div');
            heart.className = 'heart-particle';
            const size = Math.random() * 15 + 10;
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.bottom = '-20px';
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';
            heart.innerHTML = `<svg viewBox="0 0 24 24" fill="#fb7185" style="opacity: ${Math.random() * 0.3 + 0.1}"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }
        setInterval(createHeart, 1000);
    </script>
</body>
</html>
