<!-- Chosen Palette: Red Passion (bg-red-50, text-red-900, accents red-600) -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invictos - Evelyn y Juan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@300;400;600;700&family=Playfair+Display:italic,wght@0,400;0,700;1,400&display=swap');

        body { font-family: 'Nunito', sans-serif; overflow-x: hidden; }
        
        /* Estilo para los nombres y títulos románticos */
        .remachine-style { 
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(254, 202, 202, 0.5);
        }

        .fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-gradient {
            background: linear-gradient(to bottom, rgba(254, 242, 242, 0) 0%, rgba(254, 242, 242, 1) 100%);
        }

        /* Estilo de papel de carta para los mensajes */
        .letter-paper {
            background-color: #fff9f0;
            background-image: linear-gradient(#e5e5e5 1px, transparent 1px);
            background-size: 100% 2rem;
            line-height: 2rem;
        }

        /* Animación de corazones cayendo */
        .heart-particle {
            position: fixed;
            top: -10%;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body class="bg-red-50 text-slate-800 min-h-screen">

    <!-- Pantalla de Carga Inicial -->
    <div id="loader" class="loading-overlay">
        <div class="text-center">
            <i class="fa-solid fa-heart text-red-600 text-5xl animate-pulse"></i>
            <p class="mt-4 text-slate-400 font-bold tracking-widest uppercase text-xs">Abriendo vuestro mundo...</p>
            <button id="retry-btn" onclick="location.reload()" class="hidden mt-6 text-red-500 underline text-sm">¿Tarda demasiado? Haz clic aquí para refrescar</button>
        </div>
    </div>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-red-100 to-orange-50 p-4 hidden">
        <div class="glass-panel p-8 rounded-3xl shadow-2xl w-full max-w-md text-center relative overflow-hidden fade-in">
            <div class="absolute top-0 left-0 w-full h-2 bg-red-600"></div>
            <div class="inline-flex items-center justify-center w-20 h-20 bg-red-100 text-red-600 rounded-full mb-6">
                <i class="fa-solid fa-heart text-4xl"></i>
            </div>
            <h1 class="text-4xl font-bold text-red-700 mb-2">Evelyn y Juan</h1>
            <p class="text-slate-500 mb-8 italic">Introduce nuestra palabra mágica</p>
            
            <form id="login-form" class="space-y-4">
                <input type="password" id="password-input" 
                    class="w-full px-4 py-3 rounded-xl border border-red-200 focus:border-red-500 outline-none text-center text-lg" 
                    placeholder="Palabra clave..." autocomplete="off">
                <div id="login-error" class="hidden text-red-500 text-sm font-bold">Esa no es nuestra clave... ❤️</div>
                <button type="submit" 
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-lg transition-transform transform hover:scale-105">
                    Entrar a nuestro mundo
                </button>
            </form>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="main-app" class="hidden min-h-screen flex flex-col md:flex-row">
        <!-- Navegación lateral -->
        <nav class="w-full md:w-64 bg-white shadow-xl z-40 flex flex-col fixed md:sticky top-0 h-16 md:h-screen">
            <div class="p-4 md:p-6 flex items-center justify-between md:flex-col md:items-start h-full">
                <div class="flex items-center gap-2 text-red-600">
                    <i class="fa-solid fa-heart"></i>
                    <span class="text-xl font-bold remachine-style">Invictos</span>
                </div>
                
                <!-- Botones de navegación (PC) -->
                <div class="hidden md:flex flex-col gap-2 mt-10 w-full">
                    <button onclick="switchTab('dashboard')" class="tab-btn w-full text-left p-3 rounded-xl bg-red-50 text-red-600 font-bold" data-tab="dashboard">
                        <i class="fa-solid fa-house mr-3"></i> Portada
                    </button>
                    <button onclick="switchTab('gallery')" class="tab-btn w-full text-left p-3 rounded-xl text-slate-600 font-semibold" data-tab="gallery">
                        <i class="fa-solid fa-camera mr-3"></i> Fotos
                    </button>
                    <button onclick="switchTab('letters')" class="tab-btn w-full text-left p-3 rounded-xl text-slate-600 font-semibold" data-tab="letters">
                        <i class="fa-solid fa-envelope mr-3"></i> Cartas
                    </button>
                    <button onclick="switchTab('moments')" class="tab-btn w-full text-left p-3 rounded-xl text-slate-600 font-semibold" data-tab="moments">
                        <i class="fa-solid fa-star mr-3"></i> Momentos
                    </button>
                </div>
                
                <!-- Botones de navegación (Móvil) -->
                <div class="md:hidden flex gap-4">
                    <button onclick="switchTab('dashboard')" class="text-red-600 p-2"><i class="fa-solid fa-house"></i></button>
                    <button onclick="switchTab('gallery')" class="text-slate-400 p-2"><i class="fa-solid fa-camera"></i></button>
                    <button onclick="switchTab('letters')" class="text-slate-400 p-2"><i class="fa-solid fa-envelope"></i></button>
                    <button onclick="switchTab('moments')" class="text-slate-400 p-2"><i class="fa-solid fa-star"></i></button>
                </div>
            </div>
        </nav>

        <main class="flex-1 overflow-x-hidden relative z-10">
            <!-- Pestaña: Portada -->
            <div id="tab-dashboard" class="tab-content fade-in min-h-screen flex flex-col">
                <div class="relative w-full h-[55vh] overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1518199266791-bd373152a558?q=80&w=2070&auto=format&fit=crop" class="w-full h-full object-cover">
                    <div class="absolute inset-0 hero-gradient"></div>
                </div>
                <div class="max-w-4xl mx-auto px-6 py-12 text-center -mt-32 relative z-10">
                    <div class="bg-white/90 backdrop-blur-md p-10 rounded-[3rem] shadow-2xl border border-red-100">
                        <p class="serif-quote text-2xl text-slate-700 italic mb-10">
                            "Cada kilómetro, cada noche sin ti... somos <span class="text-red-600 font-bold remachine-style text-4xl block mt-4">Invictos</span>."
                        </p>
                    </div>
                </div>
            </div>

            <!-- Pestaña: Galería -->
            <div id="tab-gallery" class="tab-content hidden fade-in p-6">
                <h2 class="text-4xl font-bold text-red-900 mb-10 remachine-style">Nuestras fotos</h2>
                <div id="gallery-container" class="grid grid-cols-2 md:grid-cols-3 gap-6"></div>
            </div>

            <!-- Pestaña: Cartas -->
            <div id="tab-letters" class="tab-content hidden fade-in p-6">
                <h2 class="text-4xl font-bold text-red-900 mb-10 remachine-style">Mis cartas para ti</h2>
                <div id="letters-container" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
            </div>

            <!-- Pestaña: Momentos -->
            <div id="tab-moments" class="tab-content hidden fade-in p-6">
                <h2 class="text-4xl font-bold text-red-900 mb-10 remachine-style">Nuestra línea del tiempo</h2>
                <div id="moments-container" class="relative max-w-3xl mx-auto pl-8 border-l-2 border-red-200 space-y-12"></div>
            </div>
        </main>

        <!-- Botón flotante para añadir contenido -->
        <button onclick="toggleModal()" class="fixed bottom-8 right-8 w-16 h-16 bg-red-600 text-white rounded-full shadow-2xl flex items-center justify-center text-2xl z-50 hover:scale-110 transition-transform">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- MODAL PARA AÑADIR CONTENIDO -->
    <div id="add-modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-10 shadow-2xl">
            <h3 class="text-2xl font-bold mb-8 remachine-style">Nuevo Recuerdo</h3>
            <form id="add-form" class="space-y-5">
                <select id="new-type" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none">
                    <option value="photo">Foto (URL)</option>
                    <option value="letter">Carta</option>
                    <option value="moment">Momento</option>
                </select>
                <input type="text" id="new-title" placeholder="Título" class="w-full p-4 border rounded-2xl outline-none" required>
                <textarea id="new-content" placeholder="Escribe aquí o pega la URL de la imagen..." class="w-full p-4 border rounded-2xl outline-none h-32" required></textarea>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="toggleModal()" class="flex-1 py-4 text-slate-500 font-bold">Cancelar</button>
                    <button id="submit-btn" type="submit" class="flex-1 py-4 bg-red-600 text-white font-bold rounded-2xl shadow-lg">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        // IMPORTANTE: No tocar estas importaciones para que la base de datos funcione
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración técnica (se rellena automáticamente)
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const loader = document.getElementById('loader');
        const retryBtn = document.getElementById('retry-btn');
        const loginScreen = document.getElementById('login-screen');
        const mainApp = document.getElementById('main-app');

        // Función de seguridad: Si la carga tarda más de 5 segundos, muestra el botón de reintento
        setTimeout(() => { 
            if(loader.style.display !== 'none') retryBtn.classList.remove('hidden'); 
        }, 5000);

        // Control de autenticación
        onAuthStateChanged(auth, (user) => {
            console.log("Conectado con éxito");
            // Quitamos el cargador suavemente
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
            
            // Verificamos si ya inició sesión anteriormente en esta pestaña
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                showApp();
            } else {
                loginScreen.classList.remove('hidden');
            }
        });

        // Inicio de sesión anónimo (para la base de datos)
        signInAnonymously(auth).catch(e => console.error("Error técnico de conexión", e));

        // --- SECCIÓN DE CONTRASEÑAS ---
        // Puedes añadir más palabras aquí separadas por comas
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('password-input').value.toLowerCase().trim();
            const permitidas = ['invictos', 'invicitos', '16052025'];
            
            if (permitidas.includes(pass)) {
                sessionStorage.setItem('isLoggedIn', 'true');
                showApp();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        });

        // Mostrar la aplicación
        function showApp() {
            loginScreen.classList.add('hidden');
            mainApp.classList.remove('hidden');
            initDataSync();
            startHeartRain();
        }

        // Sincronización con la base de datos en tiempo real
        function initDataSync() {
            const memoriesRef = collection(db, 'artifacts', appId, 'public', 'data', 'memories');
            onSnapshot(memoriesRef, (snapshot) => {
                const data = [];
                snapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
                // Ordenar por los más recientes primero
                data.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                renderMemories(data);
            }, (err) => {
                console.error("Error al leer datos:", err);
            });
        }

        // Dibujar los recuerdos en pantalla
        function renderMemories(memories) {
            const gallery = document.getElementById('gallery-container');
            const letters = document.getElementById('letters-container');
            const moments = document.getElementById('moments-container');
            
            gallery.innerHTML = ''; 
            letters.innerHTML = ''; 
            moments.innerHTML = '';

            memories.forEach(m => {
                if (m.type === 'photo') {
                    gallery.innerHTML += `
                        <div class="rounded-2xl overflow-hidden shadow-lg border-4 border-white fade-in">
                            <img src="${m.content}" class="w-full aspect-square object-cover" onerror="this.src='https://placehold.co/400?text=Error+al+cargar+imagen'">
                        </div>`;
                } else if (m.type === 'letter') {
                    letters.innerHTML += `
                        <div class="bg-white p-8 rounded-3xl shadow-sm border border-red-50 letter-paper fade-in">
                            <h3 class="font-bold text-red-800 mb-2">${m.title}</h3>
                            <p class="italic text-slate-700 whitespace-pre-wrap">${m.content}</p>
                            <div class="mt-4 text-[10px] text-red-300 uppercase tracking-widest">${m.date || ''}</div>
                        </div>`;
                } else if (m.type === 'moment') {
                    moments.innerHTML += `
                        <div class="relative fade-in">
                            <div class="absolute -left-[41px] top-0 w-4 h-4 rounded-full bg-red-600 shadow-sm"></div>
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-red-50">
                                <h4 class="font-bold text-slate-800">${m.title}</h4>
                                <p class="text-slate-500">${m.content}</p>
                            </div>
                        </div>`;
                }
            });
        }

        // Guardar nuevo contenido
        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Guardando...";

            const newEntry = {
                type: document.getElementById('new-type').value,
                title: document.getElementById('new-title').value,
                content: document.getElementById('new-content').value,
                date: new Date().toLocaleDateString('es-ES'),
                timestamp: Date.now()
            };

            try {
                const memoriesRef = collection(db, 'artifacts', appId, 'public', 'data', 'memories');
                await addDoc(memoriesRef, newEntry);
                toggleModal();
                document.getElementById('add-form').reset();
            } catch (err) { 
                alert("Hubo un error al guardar. Revisa tu conexión.");
                console.error(err); 
            } finally { 
                btn.disabled = false;
                btn.innerText = "Guardar";
            }
        });

        // Cambiar entre pestañas
        window.switchTab = (tab) => {
            // Ocultar todo
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            // Quitar estilos activos de botones
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-red-50', 'text-red-600', 'font-bold');
                b.classList.add('text-slate-600', 'font-semibold');
            });

            // Mostrar activa
            document.getElementById('tab-' + tab).classList.remove('hidden');
            const activeBtn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
            if(activeBtn) {
                activeBtn.classList.add('bg-red-50', 'text-red-600', 'font-bold');
                activeBtn.classList.remove('text-slate-600', 'font-semibold');
            }
        };

        // Abrir/Cerrar ventana de añadir
        window.toggleModal = () => {
            const m = document.getElementById('add-modal');
            m.classList.toggle('hidden'); 
            m.classList.toggle('flex');
        };

        // Lluvia de corazones infinita
        function startHeartRain() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.className = 'heart-particle';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 10 + 15) + 'px';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.style.opacity = Math.random();
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 7000);
            }, 1500);
        }
    </script>
</body>
</html>
