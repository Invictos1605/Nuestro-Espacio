<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E & J | Nuestro Espacio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
        
        .heart-particle {
            position: fixed;
            top: -10%;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            color: #f43f5e;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .invictos-text {
            display: block;
            font-size: 2.5rem;
            line-height: 1.2;
            margin-top: 0.75rem;
            color: #e11d48;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-shadow: 0 4px 10px rgba(225, 29, 72, 0.2);
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #f8fafc;
            border: 2px dashed #fee2e2;
            padding: 1rem;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
            font-weight: 700;
            color: #64748b;
        }
        .file-input-label:hover { border-color: #fca5a5; background: #fff1f2; }

        /* Estilos para el visor de fotos (Lightbox) */
        #viewer-modal {
            transition: opacity 0.3s ease;
        }
        .viewer-content {
            max-height: 85vh;
        }
    </style>
</head>
<body class="bg-[#fff8f8] text-slate-800 min-h-screen">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 z-[100] bg-[#fff8f8] flex items-center justify-center p-4">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md text-center border border-rose-100 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-red-500 to-rose-600"></div>
            <div class="w-16 h-16 bg-rose-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="heart" fill="currentColor" size="32" class="animate-pulse"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800 mb-2 uppercase tracking-tighter">Evelyn y Juan</h1>
            <p class="text-slate-400 mb-8 text-sm font-medium">Introduce nuestra clave mágica</p>
            <form id="login-form" class="space-y-4">
                <input type="password" id="password-input" placeholder="Clave de nuestro mundo" 
                    class="w-full bg-slate-50 p-4 rounded-2xl border-2 border-transparent focus:border-red-200 outline-none transition-all text-center text-base font-bold">
                <p id="error-msg" class="text-red-500 text-xs font-bold hidden">Esa no es la clave, mi amor. ❤️</p>
                <button type="submit" class="w-full bg-red-600 text-white font-black py-4 rounded-2xl hover:bg-red-700 shadow-xl shadow-red-100 transition-all active:scale-95 uppercase tracking-widest text-sm">
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="main-app" class="hidden relative z-10">
        <!-- Sidebar Escritorio -->
        <aside class="hidden md:flex flex-col w-64 fixed left-0 top-0 bottom-0 bg-white border-r border-rose-100 p-8 z-40">
            <div class="flex items-center gap-3 mb-12 text-red-600">
                <i data-lucide="heart" fill="currentColor"></i>
                <span class="font-black text-xl tracking-tighter uppercase">E & J</span>
            </div>
            <nav class="flex-1 space-y-3">
                <button onclick="setTab('photo')" class="nav-btn w-full flex items-center gap-4 p-4 rounded-2xl transition-all font-bold text-sm" id="btn-photo">
                    <i data-lucide="image" size="18"></i> <span>Galería</span>
                </button>
                <button onclick="setTab('letter')" class="nav-btn w-full flex items-center gap-4 p-4 rounded-2xl transition-all font-bold text-sm" id="btn-letter">
                    <i data-lucide="file-text" size="18"></i> <span>Cartas</span>
                </button>
                <button onclick="setTab('moment')" class="nav-btn w-full flex items-center gap-4 p-4 rounded-2xl transition-all font-bold text-sm" id="btn-moment">
                    <i data-lucide="calendar" size="18"></i> <span>Diario</span>
                </button>
            </nav>
        </aside>

        <!-- Navegación Móvil -->
        <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-rose-100 flex justify-around p-4 z-50 rounded-t-3xl shadow-2xl">
            <button onclick="setTab('photo')" class="flex flex-col items-center gap-1 text-slate-400" id="m-btn-photo">
                <i data-lucide="image" size="20"></i><span class="text-[9px] font-black">FOTOS</span>
            </button>
            <button onclick="setTab('letter')" class="flex flex-col items-center gap-1 text-slate-400" id="m-btn-letter">
                <i data-lucide="file-text" size="20"></i><span class="text-[9px] font-black">CARTAS</span>
            </button>
            <button onclick="setTab('moment')" class="flex flex-col items-center gap-1 text-slate-400" id="m-btn-moment">
                <i data-lucide="calendar" size="20"></i><span class="text-[9px] font-black">DIARIO</span>
            </button>
        </nav>

        <main class="p-6 md:p-12 md:pl-72 max-w-6xl mx-auto pb-24">
            <!-- Contador -->
            <div class="mb-8 bg-white/60 backdrop-blur-md border border-rose-100 p-5 rounded-[2rem] text-center shadow-sm">
                <p class="text-slate-400 text-[9px] font-black uppercase tracking-[0.2em] mb-2">Nuestro tiempo</p>
                <div id="timer" class="flex justify-center gap-6 text-slate-800">
                    <div class="flex flex-col"><span id="days" class="text-2xl font-black tracking-tighter">00</span><span class="text-[9px] font-bold opacity-40 uppercase">Días</span></div>
                    <div class="flex flex-col"><span id="hours" class="text-2xl font-black tracking-tighter">00</span><span class="text-[9px] font-bold opacity-40 uppercase">Horas</span></div>
                    <div class="flex flex-col"><span id="minutes" class="text-2xl font-black tracking-tighter">00</span><span class="text-[9px] font-bold opacity-40 uppercase">Mins</span></div>
                    <div class="flex flex-col"><span id="seconds" class="text-2xl font-black text-red-500 tracking-tighter">00</span><span class="text-[9px] font-bold opacity-40 uppercase">Segs</span></div>
                </div>
            </div>

            <header class="flex justify-between items-end mb-10">
                <div>
                    <h2 id="section-title" class="text-3xl md:text-4xl font-black text-slate-900 tracking-tighter uppercase">FOTOS</h2>
                    <p class="text-red-500 font-bold uppercase text-[9px] tracking-[0.2em] mt-1">Nuestra historia juntos</p>
                </div>
                <button onclick="openAddModal()" class="bg-red-600 text-white p-4 rounded-2xl shadow-lg shadow-red-100 hover:bg-red-700 transition-all active:scale-90">
                    <i data-lucide="plus" stroke-width="4" size="20"></i>
                </button>
            </header>

            <div id="grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </main>
    </div>

    <!-- MODAL PARA AÑADIR -->
    <div id="add-modal" class="hidden fixed inset-0 z-[70] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] max-w-sm w-full p-8 shadow-2xl relative animate-fade">
            <h3 class="text-xl font-black mb-6 text-slate-900 uppercase tracking-tighter">Nuevo Recuerdo</h3>
            <form id="add-form" class="space-y-4">
                <input id="in-title" required placeholder="TÍTULO" class="w-full bg-slate-50 p-4 rounded-xl outline-none border-2 border-transparent focus:border-rose-100 transition-all font-bold text-sm">
                <input id="in-date" type="date" required class="w-full bg-slate-50 p-4 rounded-xl outline-none border-2 border-transparent focus:border-rose-100 transition-all font-bold text-sm">
                
                <div id="photo-upload-area" class="hidden">
                    <label class="file-input-label">
                        <i data-lucide="upload-cloud" size="20"></i>
                        <span id="file-name">Seleccionar foto</span>
                        <input id="in-file" type="file" accept="image/*" class="hidden">
                    </label>
                </div>

                <textarea id="in-content" required placeholder="TU MENSAJE..." class="w-full bg-slate-50 p-4 rounded-xl h-24 resize-none outline-none border-2 border-transparent focus:border-rose-100 transition-all font-bold text-sm"></textarea>
                
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeAddModal()" class="flex-1 py-3 text-slate-400 font-black uppercase text-[10px]">Cerrar</button>
                    <button id="submit-btn" type="submit" class="flex-1 bg-red-600 text-white font-black py-3 rounded-xl hover:bg-red-700 shadow-md uppercase text-[10px]">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- VISOR DE FOTOS AMPLIADO -->
    <div id="viewer-modal" class="hidden fixed inset-0 z-[80] bg-white/95 backdrop-blur-xl flex items-center justify-center p-4 md:p-8 overflow-y-auto">
        <button onclick="closeViewer()" class="fixed top-6 right-6 z-[90] bg-slate-100 p-3 rounded-full hover:bg-red-100 hover:text-red-600 transition-all">
            <i data-lucide="x" size="24"></i>
        </button>
        
        <div class="w-full max-w-5xl flex flex-col md:flex-row gap-8 items-center md:items-start animate-fade">
            <!-- Imagen -->
            <div class="w-full md:w-3/5 bg-slate-100 rounded-[2.5rem] overflow-hidden shadow-2xl">
                <img id="view-img" src="" class="w-full h-auto object-contain viewer-content">
            </div>
            
            <!-- Texto -->
            <div class="w-full md:w-2/5 space-y-6 text-left p-2">
                <div>
                    <span id="view-date" class="text-[10px] font-black text-red-500 uppercase tracking-[0.3em]"></span>
                    <h2 id="view-title" class="text-3xl md:text-4xl font-black text-slate-900 uppercase tracking-tighter mt-2 leading-none"></h2>
                </div>
                <div class="h-1 w-12 bg-rose-100 rounded-full"></div>
                <p id="view-content" class="text-slate-600 text-sm md:text-base font-bold leading-relaxed italic"></p>
                
                <div class="pt-8 flex items-center gap-3">
                    <div class="w-10 h-10 bg-rose-50 rounded-full flex items-center justify-center text-red-500">
                        <i data-lucide="heart" fill="currentColor" size="18"></i>
                    </div>
                    <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Recuerdo de Evelyn & Juan</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjZL-biMikywR0Z64UjLMYL0voGHOhbfQ",
            authDomain: "nuestro-espacio-1605.firebaseapp.com",
            projectId: "nuestro-espacio-1605",
            storageBucket: "nuestro-espacio-1605.firebasestorage.app",
            messagingSenderId: "838302204888",
            appId: "1:838302204888:web:d983170110c78383bcf28ad"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const appId = "invictos-web";

        let currentTab = 'photo';
        let memories = [];
        let base64Image = "";

        // Login Logic
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('password-input').value.toLowerCase().trim();
            if (['invictos', '16052025'].includes(pass)) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                initApp();
                initExtras();
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });

        function initExtras() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 12 + 8) + 'px';
                heart.style.animation = `fall ${Math.random() * 5 + 4}s linear forwards`;
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 9000);
            }, 1000);

            const startDate = new Date('2025-05-16T00:00:00');
            function updateTimer() {
                const now = new Date();
                const diff = now - startDate;
                const totalSeconds = Math.max(0, Math.floor(diff / 1000));
                const d = Math.floor(totalSeconds / (3600 * 24));
                const h = Math.floor((totalSeconds % (3600 * 24)) / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = totalSeconds % 60;
                document.getElementById('days').innerText = d.toString().padStart(2, '0');
                document.getElementById('hours').innerText = h.toString().padStart(2, '0');
                document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
                document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
            }
            setInterval(updateTimer, 1000);
            updateTimer();
        }

        // File handling
        document.getElementById('in-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('file-name').innerText = file.name;
                const reader = new FileReader();
                reader.onload = (event) => base64Image = event.target.result;
                reader.readAsDataURL(file);
            }
        });

        window.setTab = (tab) => { currentTab = tab; render(); };
        window.openAddModal = () => {
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('photo-upload-area').style.display = currentTab === 'photo' ? 'block' : 'none';
        };
        window.closeAddModal = () => { 
            document.getElementById('add-modal').classList.add('hidden'); 
            document.getElementById('add-form').reset(); 
            document.getElementById('file-name').innerText = "Seleccionar foto";
            base64Image = "";
        };

        // Lightbox Logic
        window.openViewer = (id) => {
            const m = memories.find(item => item.id === id);
            if(!m) return;
            
            document.getElementById('view-img').src = m.url || '';
            document.getElementById('view-title').innerText = m.title;
            document.getElementById('view-date').innerText = new Date(m.date).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('view-content').innerText = m.content;
            
            document.getElementById('viewer-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        };

        window.closeViewer = () => {
            document.getElementById('viewer-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        };

        function initApp() {
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'memories'));
            onSnapshot(q, (snapshot) => {
                memories = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                memories.sort((a, b) => new Date(b.date) - new Date(a.date));
                render();
            });
        }

        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Subiendo...";

            try {
                const newMem = {
                    type: currentTab,
                    title: document.getElementById('in-title').value,
                    date: document.getElementById('in-date').value,
                    url: base64Image || '',
                    content: document.getElementById('in-content').value,
                    createdAt: new Date().toISOString()
                };
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'memories'), newMem);
                closeAddModal();
            } catch (err) { 
                console.error(err); 
            } finally { 
                btn.disabled = false;
                btn.innerText = "Guardar";
            }
        });

        window.deleteItem = async (e, id) => {
            e.stopPropagation(); // Evitar que se abra el visor al borrar
            if(confirm('¿Borrar recuerdo?')) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'memories', id));
            }
        };

        function render() {
            const container = document.getElementById('grid-container');
            const titleEl = document.getElementById('section-title');
            container.innerHTML = '';
            const titles = { photo: 'FOTOS', letter: 'CARTAS', moment: 'DIARIO' };
            titleEl.innerText = titles[currentTab];

            // Tabs Styling
            ['photo', 'letter', 'moment'].forEach(tab => {
                const b1 = document.getElementById(`btn-${tab}`);
                const b2 = document.getElementById(`m-btn-${tab}`);
                const active = tab === currentTab;
                if(b1) b1.className = `nav-btn w-full flex items-center gap-4 p-4 rounded-xl transition-all font-black uppercase text-[11px] ${active ? 'bg-red-600 text-white shadow-lg' : 'text-slate-400 hover:bg-rose-50'}`;
                if(b2) b2.className = `flex flex-col items-center gap-1 transition-all ${active ? 'text-red-600 scale-105' : 'text-slate-400'}`;
            });

            const filtered = memories.filter(m => m.type === currentTab);
            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full py-16 text-center text-slate-300 font-bold uppercase tracking-widest text-xs animate-fade">No hay nada aquí aún...</div>`;
            }

            filtered.forEach(m => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-[2rem] shadow-sm overflow-hidden border border-rose-50 relative group h-80 flex flex-col animate-fade cursor-pointer";
                
                if (m.type === 'photo') {
                    card.onclick = () => openViewer(m.id);
                    card.innerHTML = `
                        <img src="${m.url}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" onerror="this.src='https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500'">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent opacity-60 group-hover:opacity-100 transition-opacity"></div>
                        <div class="absolute bottom-6 left-6 right-6 text-white translate-y-2 group-hover:translate-y-0 transition-transform">
                            <p class="text-[8px] font-black opacity-60 mb-1 uppercase tracking-widest">${new Date(m.date).toLocaleDateString()}</p>
                            <p class="font-black text-lg leading-tight uppercase tracking-tighter">${m.title}</p>
                        </div>`;
                } else {
                    card.innerHTML = `
                        <div class="p-8 h-full flex flex-col">
                            <span class="text-[8px] font-black text-red-500 uppercase tracking-[0.3em] mb-4">${new Date(m.date).toLocaleDateString()}</span>
                            <h3 class="font-black text-xl mb-3 text-slate-900 leading-tight uppercase tracking-tighter">${m.title}</h3>
                            <p class="text-slate-500 text-xs font-bold line-clamp-6 leading-relaxed flex-1">${m.content}</p>
                            <div class="mt-4 flex items-center gap-2 text-red-400">
                                <i data-lucide="arrow-right" size="14"></i>
                                <span class="text-[8px] font-black uppercase tracking-widest">Leer más</span>
                            </div>
                        </div>`;
                }
                
                // Botón de borrar
                const delBtn = document.createElement('button');
                delBtn.onclick = (e) => deleteItem(e, m.id);
                delBtn.className = "absolute top-4 right-4 p-2 bg-white/90 text-red-500 rounded-lg opacity-0 group-hover:opacity-100 transition-all hover:bg-red-500 hover:text-white shadow-md z-20";
                delBtn.innerHTML = `<i data-lucide="trash-2" size="14"></i>`;
                card.appendChild(delBtn);
                
                container.appendChild(card);
            });
            lucide.createIcons();
        }
    </script>
</body>
</html>
